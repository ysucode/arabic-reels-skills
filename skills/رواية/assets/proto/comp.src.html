<script>

function cvs(w,h,fn){const c=document.createElement('canvas');c.width=w;c.height=h;fn(c.getContext('2d'),w,h);const t=new T.CanvasTexture(c);t.colorSpace=T.SRGBColorSpace;t.anisotropy=8;return t}
function rr(g,x,y,w,h,r){g.beginPath();g.roundRect(x,y,w,h,r)}

/* the one-eyed agent, flat 2D on a plane in the 3D world */
function drawAgent(g,w,h,small){
  const s=w/512;g.save();g.scale(s,s);

  rr(g,46,62,420,410,175);g.fillStyle=CREAM;g.fill();g.lineWidth=16;g.strokeStyle=INK;g.stroke();
  g.beginPath();g.arc(256,262,150,0,7);g.fillStyle='#fff';g.fill();g.lineWidth=12;g.stroke();
  g.beginPath();g.arc(256,262,108,0,7);g.fillStyle=INK;g.fill();
  g.beginPath();g.arc(322,206,15,0,7);g.fillStyle='#fff';g.fill();
  g.restore();
}
const agentTex=cvs(512,512,drawAgent);
function smiley(g,x,y,r,cracked){
  g.save();g.translate(x,y);g.beginPath();g.arc(0,0,r,0,7);g.fillStyle='#FFD21E';g.fill();g.lineWidth=r*.05;g.strokeStyle=INK;g.stroke();

  g.beginPath();g.arc(0,r*.08,r*.42,.15,Math.PI-.15);g.closePath();g.fill();

  if(cracked){g.strokeStyle=ORG;g.lineWidth=r*.07;g.lineJoin='round';g.beginPath();g.moveTo(r*.12,-r*.98);g.lineTo(-r*.08,-r*.5);g.lineTo(r*.18,-r*.2);g.lineTo(-r*.1,r*.2);g.lineTo(r*.2,r*.5);g.lineTo(r*.02,r*.95);g.stroke()}
  g.restore();
}

}

function makeAgent(paperTex){
  const G=new T.Group();

const server=new T.Mesh(new T.BoxGeometry(30,44,16),[0,1,2,3].map(()=>new T.MeshLambertMaterial({color:0x2b2926})).concat([new T.MeshBasicMaterial({map:serverTex}),new T.MeshLambertMaterial({color:0x2b2926})]));

const folderTex=cvs(256,200,(g,w,h)=>{g.fillStyle='#D98A1F';rr(g,8,20,104,60,14);g.fill();g.fillStyle='#F6B73C';rr(g,8,46,240,146,16);g.fill();g.fillStyle='rgba(255,255,255,.28)';g.fillRect(8,60,240,5)});

const r1=rng(19);const fd=new T.Object3D();
for(let i=0;i<FN;i++){const a=r1()*Math.PI*2,R=7+r1()*2.2,z=-84-r1()*150;fd.position.set(Math.cos(a)*R,Math.sin(a)*R*1.25,z);fd.lookAt(0,0,z+6);fd.updateMatrix();folders.setMatrixAt(i,fd.matrix)}

  const me=new T.Mesh(new T.PlaneGeometry(w,w*.5),new T.MeshBasicMaterial({map:tex,transparent:true}));me.position.set(x,y,z);world.add(me);return me}

const keyTex=cvs(256,128,(g)=>{g.strokeStyle='#F6B73C';g.lineWidth=20;g.beginPath();g.arc(60,64,34,0,7);g.stroke();g.beginPath();g.moveTo(94,64);g.lineTo(226,64);g.moveTo(190,64);g.lineTo(190,98);g.moveTo(222,64);g.lineTo(222,90);g.stroke()});
const keys=[];for(let i=0;i<14;i++){const k=new T.Mesh(new T.PlaneGeometry(9,4.5),new T.MeshBasicMaterial({map:keyTex,transparent:true,alphaTest:.3}));world.add(k);keys.push(k)}

/* the river of 700 */
const SW=700;const swarm=new T.InstancedMesh(new T.PlaneGeometry(3.4,3.4),new T.MeshBasicMaterial({map:agentTex,transparent:true,alphaTest:.5,side:T.DoubleSide}),SW);swarm.frustumCulled=false;world.add(swarm);
const r2=rng(3);const sd=[];for(let i=0;i<SW;i++)sd.push([r2(),r2()*Math.PI*2,r2(),r2()]);

const BW=70,BH=104,BD=44;const bTop=-500;
const bld=new T.Mesh(new T.BoxGeometry(BW,BH,BD),new T.MeshLambertMaterial({color:0xFFF8E6}));bld.position.set(0,-6,bTop);world.add(bld);
const WN=8*11;const win=new T.InstancedMesh(new T.PlaneGeometry(5.6,6),new T.MeshBasicMaterial(),WN);win.position.set(0,-6,bTop+BD/2+.2);
const r3=rng(11);const wOrder=[];for(let i=0;i<WN;i++)wOrder.push(r3());
{let k=0;for(let j=0;j<11;j++)for(let i=0;i<8;i++){m.compose(P.set((i-3.5)*8,(j-5)*8.6,0),q,S.set(1,1,1));win.setMatrixAt(k,m);win.setColorAt(k,new T.Color(MID));k++}}
world.add(win);
const hfT=cvs(512,512,(g)=>smiley(g,256,256,190,false)),hfC=cvs(512,512,(g)=>smiley(g,256,256,190,true));

/* ---------- post: real barrel lens ---------- */
const sceneRT=new T.WebGLRenderTarget(W,H,{samples:4,type:T.HalfFloatType});
const postM=new T.ShaderMaterial({uniforms:{t:{value:sceneRT.texture},k:{value:0},fade:{value:0},col:{value:new T.Color(0,0,0)}},
 vertexShader:'varying vec2 v;void main(){v=uv;gl_Position=vec4(position.xy,0.,1.);}',
 fragmentShader:`varying vec2 v;uniform sampler2D t;uniform float k;uniform float fade;
 vec2 lens(vec2 p,float kk){vec2 a=p*vec2(1.,1.778);float r2=dot(a,a)/4.1;return .5+p*((1.-kk)+kk*r2);}
 void main(){vec2 p=v-.5;float ca=k*.012;
  vec3 c=vec3(texture2D(t,lens(p,k+ca)).r,texture2D(t,lens(p,k)).g,texture2D(t,lens(p,k-ca)).b);
  vec2 a=p*vec2(1.,1.778);float vg=smoothstep(1.35,.5,length(a)*(1.+k*.35));c*=mix(1.,vg,.55+k*.3);

#include <colorspace_fragment>
 }`});

/* ---------- keys ---------- */
const END=61.99,TP=54.4;
const expoIO=k=>k<=0?0:k>=1?1:k<.5?Math.pow(2,20*k-10)/2:(2-Math.pow(2,10-20*k))/2;
const KEYS=[ //t, x,y,z, lx,ly,lz, fov, lens, {x:whip, b:lens bump, f:fov bump}
 [0,0,.03,1.95, 0,.03,0, 62,.62],[3.2,0,.03,2.25, 0,.03,0, 60,.6],
 [4.7,.5,.4,5.6, 0,0,0, 44,.16],[6.6,.9,.5,6.8, 0,0,0, 44,.14],[12.2,.9,.5,6.8, 0,0,0, 44,.14],
 [14.2,3,2,24, 1,.5,0, 46,.2],[16.8,1,1,70, 0,0,0, 50,.24],[18.9,0,0,150, 0,0,0, 50,.3],
 [20.7,1.95,1.95,-6, 0,0,-72, 62,.3,{x:1,b:.5,f:34}],[21.8,0,0,-16, 0,0,-72, 56,.2],
 [23.1,0,0,-98.5, 0,.1,-112, 56,.2,{x:1,b:.5,f:26}],[24.8,0,.1,-99.5, 0,.1,-112, 56,.2],
 [26.3,.2,-.8,-115, .6,-.6,-130, 58,.26],[29.8,.2,-.8,-117, .6,-.6,-130, 58,.24],
 [34.4,0,0,-238, 0,0,-280, 92,.74,{i:1}],[36.6,-40,-6,-256, 34,10,-330, 64,.36],[40.7,-34,-7,-256, 30,8,-330, 64,.34],
 [41.8,-8,-12,-256, 0,0,-478, 70,.5,{b:.1}],[45,0,-10,-262, 0,20,-478, 58,.3],[49.5,0,-6,-272, 0,22,-478, 56,.18],
 [TP,0,10,-330, 0,22,-478, 50,0],
];
const HITS=[[3.3,.012],[5.14,.008],[20.7,.03],[23.1,.022],[26.5,.01],[34.4,.035],[40.8,.016],[44.99,.018]];
function camAt(t){let i=0;while(i<KEYS.length-2&&t>KEYS[i+1][0])i++;const a=KEYS[i],b=KEYS[i+1];const k=clamp((t-a[0])/(b[0]-a[0]));const q=b[9]||{};const e=q.i?k*k*k*k:q.x?expoIO(k):ss(k);
  const o=[];for(let j=1;j<9;j++)o.push(mix(a[j],b[j],e));
  const bump=Math.sin(Math.PI*e);o[7]+=(q.b||0)*bump;o[6]+=(q.f||0)*bump;
  const dist=Math.hypot(o[0]-o[3],o[1]-o[4],o[2]-o[5]);
  /* the operator's hand: a slow float, zero at both ends of the loop, plus a shake on every landing */
  const w=ss(clamp(t))*ss(clamp((TP-t)))*(1-ss(clamp((t-5.6)/1))*(1-ss(clamp((t-12)/.5))));const fl=dist*.0055*w;
  o[0]+=fl*(Math.sin(t*.9)+.6*Math.sin(t*1.73+1));o[1]+=fl*(Math.sin(t*1.1+2)+.5*Math.sin(t*2.1));
  for(const[h,amp]of HITS){const d=t-h;if(d>=0&&d<.6){const m=dist*amp*Math.exp(-d*9);o[0]+=m*Math.sin(d*71);o[1]+=m*Math.cos(d*53)}}
  return o}
